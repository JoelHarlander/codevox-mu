[package]
name = "codevox-mu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Spotify and YouTube Music in one native desktop player."
license = "MIT"
repository = "https://github.com/JoelHarlander/codevox-mu"
readme = "README.md"
publish = false

[dependencies]
# Current stable iced.
iced = "0.14.0"

[dev-dependencies]
# The theme test reads design/tokens.json. Not linked into the binary.
serde_json = "1"
