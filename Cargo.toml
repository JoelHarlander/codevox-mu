[package]
name = "codevox-mu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Spotify and YouTube Music in one native desktop player."
license = "MIT"
repository = "https://github.com/JoelHarlander/codevox-mu"
readme = "README.md"
publish = false

[dependencies]
# Current stable iced.
iced = "0.14.0"
# Unauthenticated YouTube Music InnerTube search. The crate is MIT.
# `rustls` avoids an OpenSSL build.
ytmapi-rs = { version = "0.3.4", default-features = false, features = ["rustls"] }
# The window executor is not a Tokio runtime. Search and stream
# extraction run here, off the UI thread.
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "net"] }
# YouTube Music playlist reads follow continuation pages. StreamExt is the
# iterator for that. std only: no executor of its own.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The theme test reads design/tokens.json. Search re-reads the InnerTube body.
# Playlists use serde's derive for the versioned JSON file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `--screenshot` writes the window's RGBA buffer to a PNG file.
png = "0.17"
# YouTube audio URLs. MIT. rustls, no OpenSSL.
# rustypipe is GPL-3.0 and is not a dependency. See src/extract.rs.
innertube-rs = "0.10.1"
# Symphonia decodes. cpal plays: WASAPI, CoreAudio, and ALSA.
# Symphonia itself is MPL-2.0. rodio is MIT OR Apache-2.0.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp4", "wav"] }
# YouTube Music browser cookies. The OS keyring when the session has one,
# and a per-user file when it does not.
keyring = "3"
# Spotify sign-in and the Web API. librespot-playback stays in the build so the
# old audio path still type-checks, but it is not called: newer accounts fail
# with audio key error 0/1 (librespot-org/librespot#1649). Premium playback uses
# Spotify Connect through reqwest. No Connect discovery crate.
# librespot calls process::exit on a non-Premium session; this app checks
# the account first and never connects those sessions.
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Web API reads (profile, search) before a librespot session exists.
# rustls, no OpenSSL. librespot-oauth already uses this crate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
# The interactive PKCE page is built here so the authorization URL can be
# recorded before the browser opens. Refresh still uses librespot-oauth.
# rustls, no OpenSSL. Same oauth2 major version librespot-oauth 0.8 uses.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# Opens the system browser for Spotify's authorization page.
open = "5"
# librespot's HTTP client asks rustls for the process-wide crypto provider.
# This crate enables both ring and aws-lc-rs through other dependencies, so
# rustls will not pick one on its own. Playback installs ring before connect.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# File log. librespot already emits through this crate.
log = { version = "0.4", features = ["std"] }
# OS media keys and the system overlay. MIT.
# Linux is MPRIS through libdbus (the default backend). Windows is SMTC.
# macOS is MPNowPlayingInfoCenter and MPRemoteCommandCenter.
# Building on Linux needs pkg-config and libdbus-1-dev.
souvlaki = "0.8.3"

# Release builds on Windows are GUI programs. This reattaches a parent
# console so `--smoke` and `--screenshot` still print. Already in the
# lockfile via other crates; pinned to that revision.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

# Unsigned test installers. cargo-packager 0.11.8 reads this table.
# RPM is not a packager format; cargo-generate-rpm 0.21.1 reads the table below.
# Both versions are pinned in .github/workflows/package.yml.
[package.metadata.packager]
product-name = "CodeVox mU"
identifier = "com.codevox.mu"
category = "Music"
homepage = "https://github.com/JoelHarlander/codevox-mu"
license-file = "LICENSE"
authors = ["Joel Harlander"]
publisher = "CodeVox"
out-dir = "target/packager"
long-description = "Unsigned test build of the CodeVox mU desktop player."
icons = ["assets/icon.png", "assets/icon.ico", "assets/icon.icns"]
resources = [
    "assets/fonts",
    "assets/icon.png",
    "assets/icon.ico",
    "assets/icon.icns",
    "LICENSE",
]

[package.metadata.packager.macos]
# Ad-hoc signature (`codesign -s -`). No Developer ID certificate and no notarisation.
signing-identity = "-"

[package.metadata.packager.deb]
package-name = "codevox-mu"
section = "sound"
priority = "optional"
desktop-template = "packaging/codevox-mu.desktop"
# Runtime libraries the binary dlopens. They are not in the ELF NEEDED list.
depends = [
    "libc6",
    "libgcc-s1",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcursor1",
    "libxi6",
    "libasound2",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libwayland-egl1",
    "libegl1",
    "libvulkan1",
    "libdbus-1-3",
]

[package.metadata.packager.deb.files]
LICENSE = "usr/share/doc/codevox-mu/LICENSE"

[package.metadata.packager.appimage]
# Keep the host Vulkan and GL loaders. A bundled driver breaks lavapipe and real GPUs.
# Keep the host ALSA library so PulseAudio and PipeWire plugins stay available.
excluded-libraries = [
    "libvulkan.so.1",
    "libEGL.so.1",
    "libGL.so.1",
    "libGLdispatch.so.0",
    "libGLX.so.0",
    "libasound.so.2",
]

[package.metadata.generate-rpm]
release = "1"
require-sh = false
assets = [
    { source = "target/release/codevox-mu", dest = "/usr/bin/codevox-mu", mode = "755" },
    { source = "assets/fonts/*", dest = "/usr/lib/codevox-mu/fonts/", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/lib/codevox-mu/icon.png", mode = "644" },
    { source = "assets/icon.ico", dest = "/usr/lib/codevox-mu/icon.ico", mode = "644" },
    { source = "assets/icon.icns", dest = "/usr/lib/codevox-mu/icon.icns", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/codevox-mu.png", mode = "644" },
    { source = "packaging/codevox-mu.desktop", dest = "/usr/share/applications/codevox-mu.desktop", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/codevox-mu/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
"libasound.so.2()(64bit)" = "*"

# librespot-core 0.8's build script uses vergen-gitcl 1.0 with the `build`
# feature. vergen 9.1 switched its vergen-lib dependency to 9.x, which no
# longer matches that build script. 9.0.6 is the last release that does.
[build-dependencies]
vergen = { version = "=9.0.6", default-features = false }
