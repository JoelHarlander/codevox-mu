# Unsigned test installers, uploaded as Actions artifacts.
# This workflow does not create a GitHub Release and does not push a tag.
#
# cargo-packager 0.11.8 builds the NSIS installers, the macOS dmg, the deb,
# and the AppImage. It vendors NSIS 3.09. It has no rpm format, so the rpm
# is cargo-generate-rpm 0.21.1. Both crates are pinned below.
name: Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"

jobs:
  linux:
    name: linux (appimage, deb, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libfontconfig1-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            xvfb \
            cmake \
            binutils \
            patchelf \
            file
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libfuse2t64
          elif apt-cache show libfuse2 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libfuse2
          fi

      - name: Build
        run: cargo build --locked --release

      - name: Strip
        run: strip -s target/release/codevox-mu

      - name: Install packaging tools
        run: |
          cargo install cargo-packager --version "${{ env.CARGO_PACKAGER_VERSION }}" --locked
          cargo install cargo-generate-rpm --version "${{ env.CARGO_GENERATE_RPM_VERSION }}" --locked

      - name: Package AppImage and deb
        run: cargo packager --release --formats deb,appimage

      - name: Package rpm
        run: cargo generate-rpm --auto-req builtin

      - name: Check package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/packager/*.deb)
          images=(target/packager/*.AppImage)
          rpms=(target/generate-rpm/*.rpm)
          [[ ${#debs[@]} -eq 1 ]]
          [[ ${#images[@]} -eq 1 ]]
          [[ ${#rpms[@]} -eq 1 ]]
          dpkg-deb -c "${debs[0]}" > /tmp/deb-contents.txt
          dpkg-deb -I "${debs[0]}" > /tmp/deb-info.txt
          grep -q 'usr/bin/codevox-mu' /tmp/deb-contents.txt
          grep -q 'SpaceMono-Regular.ttf' /tmp/deb-contents.txt
          grep -q 'IBMPlexMono-Regular.ttf' /tmp/deb-contents.txt
          grep -q 'codevox-mu.png' /tmp/deb-contents.txt
          grep -q 'usr/share/doc/codevox-mu/LICENSE' /tmp/deb-contents.txt
          grep -q 'libvulkan1' /tmp/deb-info.txt
          rpm -qpl "${rpms[0]}" > /tmp/rpm-contents.txt
          grep -q '/usr/bin/codevox-mu' /tmp/rpm-contents.txt
          grep -q 'SpaceMono-Regular.ttf' /tmp/rpm-contents.txt
          grep -q 'codevox-mu.png' /tmp/rpm-contents.txt
          grep -q '/usr/share/doc/codevox-mu/LICENSE' /tmp/rpm-contents.txt
          chmod +x "${images[0]}"

      - name: Smoke (AppImage)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if (( ${#icds[@]} == 0 )); then
            echo "codevox-mu: lavapipe ICD not found" >&2
            ls -la /usr/share/vulkan/icd.d >&2 || true
            exit 1
          fi
          images=(target/packager/*.AppImage)
          if (( ${#images[@]} != 1 )); then
            echo "codevox-mu: expected one AppImage" >&2
            exit 1
          fi
          export VK_DRIVER_FILES="${icds[0]}"
          export VK_ICD_FILENAMES="${icds[0]}"
          export WGPU_BACKEND=vulkan
          export WGPU_ADAPTER_NAME=llvmpipe
          unset WAYLAND_DISPLAY || true
          echo "codevox-mu: using Vulkan ICD ${icds[0]}"
          echo "codevox-mu: ${images[0]}"
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "${images[0]}" --smoke
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo "codevox-mu: direct launch failed ($status); retrying with APPIMAGE_EXTRACT_AND_RUN"
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a --server-args="-screen 0 1280x800x24" \
              "${images[0]}" --smoke
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-linux-appimage
          path: target/packager/*.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-linux-deb
          path: target/packager/*.deb
          if-no-files-found: error
          retention-days: 90

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-linux-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 90

  windows:
    name: windows-${{ matrix.arch }} (nsis, zip)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: package-windows-${{ matrix.arch }}
          cache-on-failure: true

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --version ${{ env.CARGO_PACKAGER_VERSION }} --locked

      - name: Package NSIS
        run: cargo packager --release --target ${{ matrix.target }} --formats nsis

      - name: Zip fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "codevox-mu-zip"
          $root = Join-Path $stage "codevox-mu"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "assets\fonts") | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\codevox-mu.exe" $root
          Copy-Item "assets\fonts\*" (Join-Path $root "assets\fonts")
          New-Item -ItemType Directory -Force -Path (Join-Path $root "assets") | Out-Null
          Copy-Item "assets\icon.png","assets\icon.ico","assets\icon.icns" (Join-Path $root "assets")
          Copy-Item LICENSE $root
          New-Item -ItemType Directory -Force -Path "target\packager" | Out-Null
          $zip = "target\packager\codevox-mu-windows-${{ matrix.arch }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $root -DestinationPath $zip

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-windows-${{ matrix.arch }}-nsis
          path: target/packager/*_${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-windows-${{ matrix.arch }}-zip
          path: target/packager/codevox-mu-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macos (universal dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: package-macos
          cache-on-failure: true

      - name: Build universal binary
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/codevox-mu \
            target/x86_64-apple-darwin/release/codevox-mu \
            -output target/universal-apple-darwin/release/codevox-mu
          lipo -info target/universal-apple-darwin/release/codevox-mu

      - name: Install cargo-packager
        run: cargo install cargo-packager --version "${{ env.CARGO_PACKAGER_VERSION }}" --locked

      - name: Package dmg
        run: cargo packager --release --target universal-apple-darwin --formats dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: codevox-mu-macos-universal-dmg
          path: target/packager/*.dmg
          if-no-files-found: error
          retention-days: 90
